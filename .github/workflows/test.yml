name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: make test-browsers-install
      - name: Check and build frontend
        run: pnpm --dir web build
      - name: Check formatting
        run: make format-check
      - name: Run Go, Vitest unit/browser and Playwright E2E suites
        run: make test
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: |
            web/playwright-report/
            web/test-results/
            web/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and build frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Native Windows runtime and race tests
        run: go test -race -timeout 10m ./...
      - name: Vet native Windows backend
        run: go vet ./...
      - name: Frontend unit and browser tests
        run: |
          pnpm --dir web exec playwright install chromium
          pnpm --dir web test:unit
          pnpm --dir web test:browser
      - name: Native Windows browser end-to-end smoke
        run: pnpm --dir web exec playwright test --config playwright.config.ts windows.spec.ts
      - name: Build standalone Windows binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/webmux-windows-amd64.exe ./cmd/webmux
      - name: Preserve Windows binary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-results
          path: |
            bin/webmux-windows-amd64.exe
            web/.vitest/attachments/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
