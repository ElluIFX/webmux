name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: make test-browsers-install
      - name: Check and build frontend
        run: pnpm --dir web build
      - name: Check formatting
        run: make format-check
      - name: Run Go, Vitest unit/browser and Playwright E2E suites
        run: make test
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: |
            web/playwright-report/
            web/test-results/
            web/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14
