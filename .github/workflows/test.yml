name: Test

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks; main
# runs always finish so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Platform-independent suites run on Ubuntu only. macOS keeps one job per run
# (macOS concurrency is capped per account) for the darwin-specific Go process
# code and the real-PTY E2E suite.
jobs:
  lint:
    name: Format, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Check formatting
        run: make format-check
      - name: Lint frontend
        run: pnpm --dir web lint
      - name: Check and build frontend
        run: pnpm --dir web build
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key: ${{ steps.setup.outputs.pnpm-key }}

  go:
    name: Go race (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Build embedded frontend
        run: pnpm --dir web exec vite build
      - name: Run Go race tests
        run: go test -race -parallel=4 ./...
      - name: Warm the E2E backend build cache
        run: go build -o /dev/null ./cmd/webmux
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.go-paths }}
          key: ${{ steps.setup.outputs.go-key }}

  vitest:
    name: Vitest unit and browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Run Vitest unit suite
        run: pnpm --dir web test:unit
      - name: Run Vitest browser suite
        run: pnpm --dir web test:browser
      - name: Preserve Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: web/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Build and test Storybook
        run: pnpm --dir web test:storybook
      - name: Preserve Storybook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-results
          path: |
            web/playwright-report/storybook/
            web/test-results/storybook/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Ubuntu ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
          browsers: "true"
      - name: Run Playwright E2E shard
        run: pnpm --dir web exec playwright test --config playwright.config.ts --shard=${{ matrix.shard }}/2
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ubuntu-${{ matrix.shard }}
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Go race and E2E (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
          browsers: "true"
      - name: Build embedded frontend
        run: pnpm --dir web exec vite build
      - name: Run Go race and Playwright E2E
        env:
          WEBMUX_E2E_DIST: ${{ github.workspace }}/web/dist
        run: bash .github/scripts/test-macos.sh
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-macos
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key: ${{ steps.setup.outputs.pnpm-key }}
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.go-paths }}
          key: ${{ steps.setup.outputs.go-key }}

  # Single stable check name for branch protection, independent of job layout.
  test-result:
    name: Test result
    if: always()
    needs: [lint, go, vitest, storybook, e2e, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and build frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Native Windows runtime and race tests
        run: |
          go test -race -ldflags=-linkmode=external -parallel=4 -timeout 10m ./... 2>&1 | Tee-Object -FilePath windows-go-test.log
          exit $LASTEXITCODE
      - name: Vet native Windows backend
        run: go vet ./...
      - name: Install Chromium
        run: pnpm --dir web exec playwright install chromium
      - name: Native Windows browser end-to-end smoke
        env:
          WEBMUX_E2E_DIST: ${{ github.workspace }}/web/dist
        run: |
          pnpm --dir web exec playwright test --config playwright.config.ts windows.spec.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WEBMUX_TEST_WINDOWS_SHELL = (Get-Command pwsh.exe).Source
          pnpm --dir web exec playwright test --config playwright.config.ts windows.spec.ts
      - name: Frontend unit and browser tests
        run: |
          pnpm --dir web test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web test:browser
      - name: Build standalone Windows binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=v0.1.0-windows.${{ github.run_number }}" -o bin/webmux-windows-amd64.exe ./cmd/webmux
      - name: Preserve Windows binary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-results
          path: |
            bin/webmux-windows-amd64.exe
            windows-go-test.log
            web/.vitest/attachments/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-windows:
    # Opt-in only: a deliberate release commit on the Windows branch. Ordinary
    # pushes, PRs, forks, and failed platform tests cannot publish a release.
    if: github.event_name == 'push' && github.repository == 'ElluIFX/webmux' && github.ref == 'refs/heads/windows' && contains(github.event.head_commit.message, '[release-windows]')
    needs: [test-result, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-results
          path: release-input
      - name: Package tested Windows executable
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find release-input -type f -name webmux-windows-amd64.exe)
          test "${#binaries[@]}" -eq 1
          binary="${binaries[0]}"
          test -s "$binary"
          mkdir -p release/package
          cp "$binary" release/webmux-windows-amd64.exe
          cp "$binary" release/package/webmux.exe
          cp README.md release/package/README.md
          cp docs/windows.md release/package/WINDOWS.md
          cp docs/windows.md release/WINDOWS.md
          (cd release/package && sha256sum webmux.exe > SHA256SUMS && zip -q ../webmux-windows-amd64.zip webmux.exe README.md WINDOWS.md SHA256SUMS)
          (cd release && sha256sum webmux-windows-amd64.exe webmux-windows-amd64.zip > SHA256SUMS)
      - name: Publish Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.0-windows.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" --prerelease \
            --title "WebMux Windows preview $RELEASE_TAG" \
            --notes "Native Windows amd64 preview. This commit passed native Windows Go race tests, vet, frontend unit/browser tests, and Windows browser smoke, plus the Linux/macOS test jobs before publication. See WINDOWS.md for setup, batch-launcher limitations, and security notes. ARM64 is not included in this runtime-validated release." \
            release/webmux-windows-amd64.exe \
            release/webmux-windows-amd64.zip \
            release/SHA256SUMS \
            release/WINDOWS.md
