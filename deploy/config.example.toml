# Default is loopback. Bind only a trusted Tailscale/WireGuard address.
listen = "127.0.0.1:7681"
token = ""
scrollback_bytes = 2097152
default_cwd = "~"
shell = ""
idle_after_seconds = 30
prompt_patterns = ['[$#%>❯›?:]\s*$', '(?i)\(y/n\)|\[y/n\]|yes.*no|press enter']
allowed_origins = []

[[presets]]
name = "shell"
label = "Shell"
cmd = []
allow_args = false

[[presets]]
name = "claude"
label = "Claude Code"
cmd = ["claude"]
allow_args = true

[[presets]]
name = "codex"
label = "Codex CLI"
cmd = ["codex"]
allow_args = true

[[presets]]
name = "omp"
label = "omp"
cmd = ["omp"]
allow_args = true
